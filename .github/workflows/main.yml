name: Build Reel Bajar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -o reel-bajar-build-ready.zip -d project
          find project -maxdepth 4 -type f | head -100

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Find Flutter project
        run: |
          FLUTTER_DIR=$(find project -type f -name pubspec.yaml -print -quit | xargs -r dirname)

          if [ -z "$FLUTTER_DIR" ]; then
            echo "Flutter project not found"
            exit 1
          fi

          echo "FLUTTER_DIR=$FLUTTER_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $FLUTTER_DIR"

      - name: Build APK
        run: |
          cd "$FLUTTER_DIR"
          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reel-Bajar-APK
          path: '**/build/app/outputs/flutter-apk/*.apk'

          
