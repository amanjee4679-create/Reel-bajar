name: Build Reel Bajar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q reel-bajar-build-ready.zip -d project

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Find Android project
        run: |
          ANDROID_DIR=$(find project -type f -name "settings.gradle*" -printf '%h\n' | head -n 1)

          if [ -z "$ANDROID_DIR" ]; then
            echo "Android project नहीं मिला"
            find project -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android project: $ANDROID_DIR"

      - name: Build APK
        run: |
          cd "$ANDROID_DIR"
                    cat > /tmp/fix.gradle <<'EOF'
          allprojects {
            configurations.configureEach {
              resolutionStrategy.eachDependency {
                if (requested.group == "org.jetbrains.kotlin" &&
                    (requested.name == "kotlin-stdlib-jdk7" ||
                     requested.name == "kotlin-stdlib-jdk8")) {
                  useVersion("1.8.22")
                }
              }
            }
          }
          EOF
          gradle assembleDebug --no-daemon --init-script /tmp/fix.gradle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reel-bajar-apk
          path: "**/build/outputs/apk/debug/*.apk"
