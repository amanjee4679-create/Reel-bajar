name: Build Reel Bajar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -o reel-bajar-build-ready.zip -d project
          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          GRADLEW=$(find project -type f -name gradlew -print -quit)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            exit 1
          fi
          ANDROID_DIR=$(dirname "$GRADLEW")
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android project: $ANDROID_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reel-Bajar-APK
          path: '**/build/outputs/apk/**/*.apk'
