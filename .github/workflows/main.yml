
      - name: Build APK
        run: |
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew नहीं मिला"
            echo "Current directory:"
            pwd
            echo "Files:"
            ls -la
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
